/pointcloud_to_laserscan:
  ros__parameters:
    target_frame: lidar_link  # evoart_description'da tanımladığımız Lidar noktası
    transform_tolerance: 0.01
    min_height: -0.3   # Aracın altına doğru tarama sınırı (metre)
    max_height: 0.2    # Aracın üstüne doğru tarama sınırı (metre)
    angle_min: -3.1415 # -180 derece
    angle_max: 3.1415  # +180 derece
    angle_increment: 0.0087 # 0.5 derece çözünürlük
    scan_time: 0.1
    range_min: 0.2
    range_max: 30.0
    use_inf: true
