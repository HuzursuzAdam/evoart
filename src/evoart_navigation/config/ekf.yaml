ekf_filter_node:
  ros__parameters:
    use_sim_time: true
    frequency: 30.0
    two_d_mode: true  # Araç uçmadığı için 2D modda kalması şart (Z ekseni yoksayılır)
    publish_tf: true
    
    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: odom

    # 1. TEKERLEK ENKODERİ (STM32/micro-ROS'tan gelen veri)
    # Hız ve pozisyon (X, Y ve Yaw) değerlerini alıyoruz
    odom0: /odom 
    odom0_config: [true,  true,  false,
                   false, false, true,
                   true,  true,  false,
                   false, false, true,
                   false, false, false]
    odom0_differential: false

    # 2. ZED 2i KAMERANIN IMU VERİSİ (Harici IMU yerine)
    # Sadece açısal hız (Yaw hızı) ve doğrusal ivmeyi alıyoruz
    imu0: /zed/zed_node/imu/data
    imu0_config: [false, false, false,
                  false, false, false,
                  false, false, false,
                  false, false, true,
                  true,  true,  false]
    imu0_differential: false
    imu0_remove_gravitational_acceleration: true

    # 3. ZED 2i GÖRSEL ODOMETRİ (Ekstra Kararlılık İçin - Opsiyonel ama Şiddetle Tavsiye Edilir)
    # Kameranın etrafı izleyerek çıkarttığı yer değiştirme verisi
    odom1: /zed/zed_node/odom
    odom1_config: [true,  true,  false,
                   false, false, true,
                   true,  true,  false,
                   false, false, true,
                   false, false, false]
    odom1_differential: false
